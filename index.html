<!DOCTYPE html>
<html lang="en">
<head>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
/>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orange Smart Bot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes waveAnim {
      0%, 100% { height: 4px; }
      50%       { height: 18px; }
    }
    @keyframes typingDot {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40%            { transform: translateY(-6px); opacity: 1; }
    }
    @keyframes ripple {
      0%   { transform: scale(1);   opacity: 0.7; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    @keyframes floatBounce {
      0%, 100% { transform: translateY(0) scale(1); }
      30%      { transform: translateY(-8px) scale(1.05); }
      60%      { transform: translateY(-3px) scale(1.02); }
    }
    @keyframes pulseRing {
      0%   { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(1.7); opacity: 0; }
    }
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(10px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .chat-scroll::-webkit-scrollbar { display: none; }
    .chat-scroll { scrollbar-width: none; -ms-overflow-style: none; }

    .toggle-float { animation: floatBounce 2.8s ease-in-out infinite; }
    .toggle-float:hover { animation-play-state: paused; transform: scale(1.12) !important; }

    .pulse-ring {
      position: absolute; inset: 0; border-radius: 50%;
      border: 2px solid rgba(255,102,0,0.6);
      animation: pulseRing 1.8s ease-out infinite;
    }
    .pulse-ring2 {
      position: absolute; inset: 0; border-radius: 50%;
      border: 2px solid rgba(255,102,0,0.4);
      animation: pulseRing 1.8s ease-out 0.9s infinite;
    }

    .stop-wrap { position: relative; }
    .stop-wrap::before, .stop-wrap::after {
      content: ''; position: absolute; inset: 0; border-radius: 50%;
      background: rgba(239,68,68,0.3);
      animation: ripple 1.4s ease-out infinite;
      pointer-events: none;
    }
    .stop-wrap::after { animation-delay: 0.7s; }

    .chat-modal-anim { animation: fadeSlideIn 0.25s ease; }

    .wave-bar {
      width: 3px; border-radius: 2px;
      background: rgba(255,255,255,0.85);
      flex-shrink: 0; height: 4px;
    }
    .wave-bar.active { animation: waveAnim 0.85s ease-in-out infinite; }

    .rec-wave-bar {
      width: 3px; border-radius: 2px;
      background: #ff6600; flex-shrink: 0;
      animation: waveAnim 0.8s ease-in-out infinite;
    }

    .typing-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #94a3b8;
      animation: typingDot 1s ease-in-out infinite;
    }

    .rec-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #ef4444; flex-shrink: 0;
      animation: typingDot 1s ease-in-out infinite;
    }

    @media (max-width: 480px) {
      #chatModal {
        left: 0 !important; top: 0 !important;
        width: 100vw !important; height: 100dvh !important;
        border-radius: 0 !important;
      }
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen">

  <!-- Toggle Button -->
  <button
    id="toggleBtn"
    onclick="ChatBot.open()"
    class="toggle-float fixed bottom-6 right-6 w-14 h-14 rounded-full border-0 cursor-pointer z-[999] flex items-center justify-center text-2xl text-white"
    style="background: linear-gradient(135deg,#ff6600,#cc4400); box-shadow: 0 4px 20px rgba(255,102,0,0.45);"
  >
    <div class="pulse-ring"></div>
    <div class="pulse-ring2"></div>
    <i class="fa-regular fa-message"></i>
  </button>

  <!-- Chat Modal -->
  <div
    id="chatModal"
    class="chat-modal-anim fixed z-[1000] flex-col overflow-hidden hidden"
    style="
      width: 340px; height: 520px;
      background: #0f172a;
      border-radius: 20px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,102,0,0.2);
      user-select: none;
    "
  >
    <!-- Header -->
    <div
      id="chatHeader"
      class="flex items-center justify-between px-3.5 py-3 flex-shrink-0"
      style="background: linear-gradient(135deg,#ff6600,#cc4400); cursor: grab;"
    >
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-full flex items-center justify-center text-base flex-shrink-0"
          style="background: rgba(255,255,255,0.25);">🤖</div>
        <div>
          <div class="font-bold text-white text-sm tracking-wide">Orangebd Smart Assistant</div>
          <!-- WebSocket status indicator -->
          <div id="status" class="text-xs text-yellow-300">● Connecting...</div>
        </div>
      </div>
      <div class="flex gap-1.5">
        <button onclick="ChatBot.close()"
          class="w-5 h-5 rounded-full flex items-center justify-center text-white text-xs cursor-pointer border-0"
          style="background: rgba(255,255,255,0.2);">—</button>
        <button onclick="ChatBot.close()"
          class="w-5 h-5 rounded-full flex items-center justify-center text-white text-xs cursor-pointer border-0 hover:bg-red-500"
          style="background: rgba(255,255,255,0.2);">✕</button>
      </div>
    </div>

    <!-- Messages -->
    <div id="chatMessages"
      class="chat-scroll flex-1 overflow-y-auto flex flex-col gap-2 px-3 py-3"
      style="background: #0f172a;">
    </div>

    <!-- Input Area -->
    <div class="flex items-center gap-1.5 px-2.5 py-2 flex-shrink-0" style="background: #1e293b;">

      <!-- Text input -->
      <input
        id="textInput"
        type="text"
        placeholder="Type message..."
        class="flex-1 px-3.5 py-2 rounded-full text-sm outline-none border-0 min-w-0"
        style="background: #f1f5f9; color: #1e293b; cursor: text;"
        onkeydown="ChatBot.handleKey(event)"
      />

      <!-- Recording bar (hidden by default) -->
      <div id="recBar"
        class="flex-1 items-center gap-1.5 px-3 py-1.5 rounded-full min-w-0 hidden"
        style="background: #0f172a;">
        <div class="rec-dot"></div>
        <span id="recTime" class="text-xs font-mono flex-shrink-0" style="color: #f87171;">0:00</span>
        <div id="recWaves" class="flex items-end gap-0.5"></div>
        <span class="text-xs ml-auto flex-shrink-0" style="color: #475569;">tap ➤ to send</span>
      </div>

      <!-- Stop button (hidden by default) -->
      <div id="stopWrap" class="stop-wrap w-9 h-9 flex items-center justify-center flex-shrink-0 hidden">
        <button onclick="ChatBot.toggleRecording()"
          class="relative z-10 w-9 h-9 rounded-full flex items-center justify-center border-0 cursor-pointer"
          style="background: #ef4444;">
          <div style="width:11px;height:11px;background:white;border-radius:2px;"></div>
        </button>
      </div>

      <!-- Mic button -->
      <button id="micBtn" onclick="ChatBot.toggleRecording()"
        class="w-9 h-9 rounded-full flex items-center justify-center border-0 cursor-pointer flex-shrink-0 text-sm text-white"
        style="background: #ff6600;"><i class="fa-solid fa-microphone"></i></button>

      <!-- Send button -->
      <button id="sendBtn" onclick="ChatBot.send()"
        class="w-9 h-9 rounded-full flex items-center justify-center border-0 cursor-pointer flex-shrink-0 text-sm text-white"
        style="background: #ff6600;">➤</button>
    </div>
  </div>

  <script src="chatbot.js"></script>
</body>
</html>
